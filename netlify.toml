[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/otp/send"
  to = "/.netlify/functions/send-otp"
  status = 200

[[redirects]]
  from = "/api/otp/verify"
  to = "/.netlify/functions/verify-otp"
  status = 200

[[redirects]]
  from = "/api/forms/submit"
  to = "/.netlify/functions/submit-form"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
